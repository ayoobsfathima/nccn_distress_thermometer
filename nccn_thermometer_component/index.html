<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { display: flex; justify-content: center; }
  svg { display: block; max-width: 100%; height: auto; -webkit-tap-highlight-color: transparent; }
  .row { cursor: pointer; outline: none; }
  .row:focus-visible .dot { stroke-width: 4; }
  .row:hover .dot { stroke-width: 3.5; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Minimal Streamlit custom-component protocol -- no build step, no
  // third-party library. Draws the distress thermometer and sends the
  // tapped score back to the Python side.
  const FRAME_HEIGHT = 500;

  function post(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }

  function choose(score) {
    // nonce makes a repeat tap on the same number still count as a new event
    post("streamlit:setComponentValue", {
      value: { score: score, nonce: Date.now() },
      dataType: "json",
    });
  }

  function draw(selected) {
    const topY = 20, bottomY = 460, bulbR = 34;
    const step = (bottomY - bulbR - topY) / 10;
    const tubeX = 90, tubeW = 26, cx = tubeX + 55;
    const NS = "http://www.w3.org/2000/svg";

    let html = '<svg width="200" height="500" viewBox="0 0 200 500" xmlns="' + NS + '" role="group" aria-label="Distress thermometer, 0 to 10">';
    html += '<rect x="' + (tubeX - tubeW / 2) + '" y="' + topY + '" width="' + tubeW + '" height="' + (bottomY - topY - bulbR) +
            '" rx="13" fill="#ffffff" stroke="#0b3d6e" stroke-width="3"/>';
    html += '<circle cx="' + tubeX + '" cy="' + bottomY + '" r="' + bulbR + '" fill="#ffffff" stroke="#0b3d6e" stroke-width="3"/>';

    for (let i = 10; i >= 0; i--) {
      const y = topY + (10 - i) * step + 14;
      const isSel = selected === i;
      const fill = isSel ? "#1f6fae" : "#f4f9fd";
      const numFill = isSel ? "#ffffff" : "#0b3d6e";
      // The invisible rect is the touch target: a full-width band about 40px
      // tall around each number, so a finger doesn't have to hit the small circle.
      html += '<g class="row" data-score="' + i + '" role="button" tabindex="0" aria-label="Distress score ' + i + '"' +
              ' aria-pressed="' + (isSel ? "true" : "false") + '">' +
              '<rect x="' + (tubeX - tubeW / 2 - 6) + '" y="' + (y - step / 2) + '" width="' + (200 - (tubeX - tubeW / 2 - 6)) +
              '" height="' + step + '" fill="transparent"/>' +
              '<line x1="' + (tubeX + tubeW / 2) + '" y1="' + y + '" x2="' + (cx - 14) + '" y2="' + y + '" stroke="#0b3d6e" stroke-width="2"/>' +
              '<circle class="dot" cx="' + cx + '" cy="' + y + '" r="14" fill="' + fill + '" stroke="#0b3d6e" stroke-width="2"/>' +
              '<text x="' + cx + '" y="' + (y + 5) + '" text-anchor="middle" font-size="13" font-weight="bold" fill="' + numFill +
              '" font-family="Arial" pointer-events="none">' + i + '</text>' +
              '</g>';
    }
    html += "</svg>";
    document.getElementById("root").innerHTML = html;

    document.querySelectorAll(".row").forEach(function (el) {
      const score = Number(el.getAttribute("data-score"));
      el.addEventListener("click", function () { choose(score); });
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(score); }
      });
    });
  }

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};
    const sel = args.selected === null || args.selected === undefined ? null : Number(args.selected);
    draw(sel);
    post("streamlit:setFrameHeight", { height: FRAME_HEIGHT });
  });

  post("streamlit:componentReady", { apiVersion: 1 });
  post("streamlit:setFrameHeight", { height: FRAME_HEIGHT });
</script>
</body>
</html>
